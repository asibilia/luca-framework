issues:
  - severity: MEDIUM
    file: packages/luca-state/src/bridge.ts
    lines: "275, 288"
    issue: "Lodash get() accepts arbitrary field paths without allowlist in read-field command"
    description: |
      The handleReadField() function uses lodash get() with an untrusted field path
      argument without validation. Unlike set-field which has SETTABLE_FIELDS allowlist,
      read-field has no restrictions and can access sensitive fields like gates,
      session_id, or internal state.
    impact: "Information disclosure of workflow state (local machine only)"
    suggestion: |
      Add READABLE_FIELDS allowlist and validate fieldPath before calling get():

      const READABLE_FIELDS = [...SETTABLE_FIELDS, "state", "current_state"] as const;

      if (!READABLE_FIELDS.includes(fieldPath as any)) {
        console.error(`Field not readable. Allowed: ${READABLE_FIELDS.join(", ")}`);
        process.exit(2);
      }

  - severity: MEDIUM
    file: packages/luca-state/src/bridge.ts
    lines: "732, 818"
    issue: "Checkpoint path construction accepts arbitrary phase IDs without upper bound"
    description: |
      The suspend and resume-phase commands validate that phaseId >= 0 and is finite,
      but do not validate an upper bound. This allows creating millions of checkpoint
      files if the command is invoked repeatedly with large phase numbers, causing
      filesystem exhaustion and denial of service on shared development machines.
    impact: "Denial of Service via filesystem exhaustion (requires CLI access)"
    suggestion: |
      Add upper bound validation to phase IDs:

      const MAX_PHASE_ID = 999999;
      if (!Number.isFinite(phaseId) || phaseId < 0 || phaseId > MAX_PHASE_ID) {
        console.error(`Invalid phase number: ${phaseStr}`);
        process.exit(2);
      }

      Or validate against actual workflow state phases.

  - severity: MEDIUM
    file: packages/luca-state/src/bridge.ts
    lines: "343-349"
    issue: "JSON.parse() in set-field accepts arbitrary JSON without size/depth limits"
    description: |
      The set-field command parses user-supplied JSON values without size or depth limits.
      While Zod schema validation provides eventual defense-in-depth, a malicious actor
      could send deeply nested JSON to cause memory exhaustion or performance degradation.
      No immediate code injection risk (JSON.parse is safe), but resource exhaustion possible.
    impact: "Potential DoS via deeply nested JSON payloads (mitigated by schema validation)"
    suggestion: |
      Add JSON size and depth validation before parsing:

      const MAX_JSON_SIZE = 10000;
      const MAX_JSON_DEPTH = 20;

      if (rawValue.length > MAX_JSON_SIZE) {
        console.error("Value exceeds maximum size");
        process.exit(2);
      }

      const depthTracker = { depth: 0, maxDepth: MAX_JSON_DEPTH };
      value = JSON.parse(rawValue, (key, val) => {
        if (typeof val === 'object' && val !== null) {
          depthTracker.depth++;
          if (depthTracker.depth > depthTracker.maxDepth) {
            throw new Error("JSON nesting too deep");
          }
        }
        return val;
      });

