# The required check on every pull request that isn't a draft (#788).
# Luca opens its run PRs as drafts and marks them ready after the final
# review, so a run's PR is checked once, when it's marked ready. A draft
# isn't checked: mark it ready to run the check.
#
# It runs on Linux. Bun installs with --backend=copyfile, so no file in
# node_modules is a hard link to Bun's cache (Linux's default backend);
# the after-turn check tests make their own copies too.
#
#   1. Every check in .luca/config.json, read from that file by
#      scripts/run-checks.ts, so CI and Luca's own gates can't drift apart.
#   2. Bun-pack the publish package and fail on any catalog: or workspace:
#      range left in its packed package.json.
#   3. `changeset status` against main, to catch a forgotten changeset.
#      Skipped on the Version PR's branch (changeset-release/*), which
#      consumes the changesets.
#   4. The PR's commit messages hold no path to a private folder (the
#      repo's files are checked by `bun run lint`, in step 1). The PR's
#      title and body are checked by pr-text-check.yml, which also runs
#      when they are edited.

name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # changeset status compares against origin/main.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --backend=copyfile

      - name: Run the checks in .luca/config.json
        run: bun scripts/run-checks.ts

      - name: Pack the publish package
        run: bun packages/luca/scripts/check-pack.ts

      - name: No private paths in the commit messages
        run: bun scripts/check-private-paths.ts --commits origin/main..HEAD

      - name: Changeset status
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        run: bunx changeset status --since=origin/main
