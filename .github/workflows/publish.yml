# Publish @alecsibilia/luca-framework to npm when a GitHub release is created.
#
# Requirements:
#   REQ-13: Auto-publish on release (type: published)
#   REQ-14: Run typecheck before publishing
#   REQ-15: Authenticate via NPM_TOKEN repository secret
#   REQ-16: Publish with --access restricted
#
# Setup:
#   1. Generate an npm access token (granular or classic) with publish permission
#      scoped to @alecsibilia/luca-framework.
#   2. Add it as a repository secret named NPM_TOKEN:
#      Settings > Secrets and variables > Actions > New repository secret
#   3. Create a GitHub release (tag format: v*.*.* required) to trigger this workflow.
#      The version is derived from the release tag — no need to manually bump package.json.

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (for npm publish auth)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx --bun tsc --noEmit

      - name: Set version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Release tag must be in v*.*.* format (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          cd packages/luca-framework
          bun -e "
            const pkg = await Bun.file('package.json').json();
            pkg.version = '$VERSION';
            await Bun.write('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Publishing version: $VERSION"

      - name: Publish to npm
        run: cd packages/luca-framework && npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
