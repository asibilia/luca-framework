# Changesets-driven release of @alecsibilia/luca, on every push to main.
#
#   1. With pending changesets, the version job opens (or updates) the
#      Version PR: `changeset version`, which bumps the publish package and
#      writes its CHANGELOG.md.
#   2. With none pending (the Version PR was merged), the publish job runs
#      if the publish package's version isn't on npm yet. Otherwise nothing
#      happens.
#
# scripts/release-plan.ts decides which, from `changeset status` and npm's
# registry. changesets/action v2 no longer reads a printed `New tag:` line,
# so publishing is its own job. Changesets' own pack and publish steps
# aren't used: they `npm pack`, which ships catalog: ranges unchanged.
#
# The file must stay named release.yml: npm's trusted publisher for
# @alecsibilia/luca names it (owner asibilia, repo luca-framework,
# workflow release.yml, environment npm-publish). No npm token is used.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan the release
        id: plan
        run: bun scripts/release-plan.ts

      - name: Ensure the "automated" label exists
        if: steps.plan.outputs.pending == 'true'
        run: |
          gh label create automated \
            --color cccccc \
            --description "Auto-generated by GitHub Actions" \
            2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or update the Version PR
        id: changesets
        if: steps.plan.outputs.pending == 'true'
        uses: changesets/action@v2.0.0
        with:
          version-script: bun run version
          pr-title: ${{ steps.plan.outputs.title }}
          commit-message: ${{ steps.plan.outputs.title }}
          # The publish job makes the GitHub release.
          create-github-releases: false
          # v2 pushes through GitHub's API by default. Don't add the old
          # `commit-mode` input: v2 refuses to run with it.
          github-token: ${{ github.token }}

      - name: Label the Version PR "automated"
        if: steps.changesets.outputs.pr-number != ''
        run: gh pr edit ${{ steps.changesets.outputs.pr-number }} --add-label automated
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.publish == 'true'
    # macOS, like the PR check: on Linux, Bun hard-links packages from its
    # cache, and two tests fail there.
    runs-on: macos-latest
    # npm's trusted publisher requires the OIDC token's `environment` claim
    # to be npm-publish; without it npm fails with ENEEDAUTH.
    environment: npm-publish
    permissions:
      # The GitHub release.
      contents: write
      # npm trusted publishing (OIDC): npm swaps this token for a
      # short-lived publish credential.
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Node 24's npm is 11.5.1 or later, which trusted publishing needs.
      # No `registry-url`: with it, setup-node writes an .npmrc with an
      # `_authToken`, which npm then uses instead of OIDC.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1. The same checks as a PR (changeset status is skipped: the
      #    changesets were just consumed).
      - name: Run the checks in .luca/config.json
        run: bun scripts/run-checks.ts

      - name: Check the packed publish package
        run: bun packages/luca/scripts/check-pack.ts

      # 2. Bun-pack, which turns catalog: and workspace: into real versions.
      - name: Pack the publish package
        id: pack
        working-directory: packages/luca
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"

      # 3. Prove the tarball installs and runs: install it into a temporary
      #    global folder, outside the repo, and run a practice run from it.
      - name: Install the tarball and run luca-run --demo
        working-directory: ${{ runner.temp }}
        env:
          BUN_INSTALL_GLOBAL_DIR: ${{ runner.temp }}/luca-global
          BUN_INSTALL_BIN: ${{ runner.temp }}/luca-global/bin
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          bun add -g "$TARBALL"
          "$BUN_INSTALL_BIN/luca-run" --demo

      # 4. Only alphas go out until a real tmnb run works, so `latest` stays
      #    on 13.0.1. Switching on `latest` is one reviewed PR that runs
      #    `changeset pre exit` and changes this guard and the npm tag below.
      - name: Refuse any version that isn't -alpha.N
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "::error::$VERSION isn't an -alpha.N version; only alphas are published for now."
            exit 1
          fi

      # 5. npm publishes because Bun can't publish over OIDC yet.
      - name: Publish to npm over trusted publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}" --tag alpha --access public

      # 6. Marked as a prerelease, so the repo's "Latest" badge doesn't
      #    point at an alpha.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun scripts/release-notes.ts > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "@alecsibilia/luca@$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
