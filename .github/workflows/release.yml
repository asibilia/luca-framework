# Changesets-driven release pipeline.
#
# Flow:
#   1. PR with .changeset/*.md merges to main
#   2. This workflow opens (or updates) a "Version Packages" PR that bumps
#      package versions and updates CHANGELOG.md
#   3. When that PR merges to main, this workflow runs again — but with no
#      pending changesets, so it executes the `publish` command instead,
#      which creates a GitHub Release tagged v<luca-framework version>
#   4. The Release triggers .github/workflows/publish.yml, which publishes
#      @alecsibilia/luca-framework to npm

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Open Version PR or create Release
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun .github/scripts/create-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
