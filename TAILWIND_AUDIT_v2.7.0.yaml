issues:
  # CRITICAL: Hardcoded arbitrary grid template layout
  - severity: CRITICAL
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/layout/detail-layout.tsx
    line: 14
    issue: |
      Arbitrary grid-cols value hardcoded in className string.
      Using `lg:grid-cols-[1fr_320px]` embeds the sidebar width as arbitrary value
      instead of using Tailwind's consistent spacing scale. Makes responsive design
      harder to maintain and inconsistent with scale-based approach.
    suggestion: |
      Extract sidebar width to theme config or use consistent Tailwind widths.
      Option 1: Update to `lg:grid-cols-[1fr_64] lg:gap-6` (64 = 16*4 for 320px).
      Option 2: Create custom grid-template in tailwind.config with named sidebar width.
      Option 3: Consider using `lg:flex lg:gap-6` with `lg:w-80` (320px in scale) for sidebar.
    cross_phase: true

  # HIGH: Responsive grid doesn't account for very large screens
  - severity: HIGH
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/dashboard/overview-cards.tsx
    line: 103
    issue: |
      Grid responsive breakpoints: grid-cols-2 → lg:grid-cols-4 → xl:grid-cols-8
      Jump from 4 columns at 1024px to 8 columns at 1280px is aggressive.
      On 2xl+ screens (1536px), still showing 8 columns without further optimization.
      Can cause card compression on ultra-wide displays.
    suggestion: |
      Add 2xl breakpoint: `grid-cols-2 gap-4 lg:grid-cols-4 xl:grid-cols-6 2xl:grid-cols-8`
      This provides smoother scaling across viewport sizes and reduces compression.
    cross_phase: true

  # HIGH: Arbitrary pixel values for container sizing
  - severity: HIGH
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/workflow/transition-log.tsx
    line: 58
    issue: |
      Table uses `min-w-[480px]` arbitrary value to prevent content collapse.
      480px is hardcoded instead of using Tailwind's w-screen or container scale.
      Makes horizontal scrolling behavior inconsistent across the app.
    suggestion: |
      Replace `min-w-[480px]` with Tailwind scale value like `min-w-96` (24rem ≈ 384px).
      If 480px is required, document why and consider adding to tailwind.config theme.
      Better: Use `grid` layout on mobile/tablet, `table` on desktop with responsive wrapper.
    cross_phase: false

  # HIGH: No dark mode contrast handling
  - severity: HIGH
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components
    line: 0
    issue: |
      Zero instances of `dark:` variant usage across all 45 components.
      App has light/dark theme toggle (header.tsx line 18) but styling does NOT
      adapt text contrast, backgrounds, or borders for dark mode.
      CSS variables in globals.css support dark theme (html.light block present),
      but components only use `var(--color-*)` in inline styles, not Tailwind variants.
    suggestion: |
      1. Add `dark:` variants where theme contrast matters:
         - Dark backgrounds need light text: add `dark:text-foreground` where needed
         - Muted text needs boost in dark: consider `dark:text-muted-foreground/80`
      2. For dynamic colors via vars, create Tailwind plugin that adds dark: aware CSS vars
      3. Verify all opacity values work in both themes (test e.g. `text-muted-foreground/30`)
      4. Test all color-mix() fallbacks in both light and dark modes
    cross_phase: true

  # MEDIUM: Inconsistent inline style usage for dynamic colors
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/memory/context-usage-bar.tsx
    line: 119
    issue: |
      Status badge uses inline styles for color-mix fallback:
      ```
      style={{
        color: `var(--color-${zone})`,
        backgroundColor: `color-mix(in oklab, var(--color-${zone}) 15%, transparent)`,
      }}
      ```
      This pattern is repeated in ~12 components (check-result-card.tsx, budget-gauge.tsx,
      quality-zone-indicator.tsx, etc.). While necessary for dynamic color values,
      it bypasses Tailwind's class-based system and prevents consistency checks.
    suggestion: |
      1. Create reusable `colorMixBg` utility function:
         ```typescript
         const colorMixBg = (colorVar: string) => ({
           color: `var(--color-${colorVar})`,
           backgroundColor: `color-mix(in oklab, var(--color-${colorVar}) 15%, transparent)`,
         })
         ```
      2. Or create Tailwind plugin that generates color-mix classes:
         ```
         .badge-color-{color} { /* auto-generates color-mix */}
         ```
      3. Document this pattern in a shared style utilities file.
    cross_phase: false

  # MEDIUM: Text size arbitrary value
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/app/globals.css
    line: 1
    issue: |
      CSS output includes `text-[10px]` arbitrary value (compiled from source).
      10px is below Tailwind's standard text-xs (12px / 0.75rem).
      No usage found in current components, but exists in compiled globals.css.
      Suggests past use of non-standard typography scale.
    suggestion: |
      1. Audit source for text-[10px] usage and replace with text-xs or reduce to text-2xs
      2. If 10px is truly required, add to tailwind.config fontSize scale
      3. Verify all text sizes use Tailwind scale: text-xs, text-sm, text-base, etc.
      4. Consider defining typography scales in theme for consistency
    cross_phase: false

  # MEDIUM: Responsive padding inconsistency
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/layout/page-container.tsx
    line: 23
    issue: |
      Padding uses `p-3 md:gap-6 md:p-6` but gap only defined at md breakpoint.
      Smaller screens get gap-4 (default) at mobile, gap-6 at md+.
      This creates inconsistency: padding jumps 3→6 (2x) while gap only 4→6.
      Similar pattern in header.tsx (px-2 md:px-4).
    suggestion: |
      1. Standardize scaling ratio. Option A (current):
         - Mobile: p-3, gap-4
         - Desktop: p-6, gap-6 (2x scaling)
      2. Better: Add sm: intermediate:
         - Mobile: p-2, gap-2
         - Tablet (sm): p-3, gap-3
         - Desktop (md): p-6, gap-6
      3. Document intended spacing rhythm for consistency
    cross_phase: false

  # MEDIUM: Missing responsive text size adaptation
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/layout/header.tsx
    line: 33
    issue: |
      Header connection label hidden on mobile (`sm:inline`) but font-mono text-xs
      is same size across all breakpoints. On mobile, label is removed but no text
      size increase for remaining header elements.
      Reduces vertical space efficiency on small screens without corresponding UX benefit.
    suggestion: |
      1. Consider responsive text sizes: `text-xs sm:text-sm` for header labels
      2. Or justify hiding connection label by making remaining content larger/clearer
      3. Verify font-mono at text-xs is readable on small screens (typically 10px)
      4. Add sm:text-sm to button labels for better mobile readability
    cross_phase: false

  # MEDIUM: Hardcoded percentage-based widths in dynamic layouts
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/planning/quality-zone-indicator.tsx
    line: 124
    issue: |
      Quality zone bar uses hardcoded grid-template-columns: `"30% 20% 20% 30%"`
      This embeds zone width ratios as computed styles instead of Tailwind classes.
      Makes it hard to adjust zone boundaries consistently across themes.
    suggestion: |
      Replace inline style grid:
      ```
      style={{ display: "grid", gridTemplateColumns: "30% 20% 20% 30%" }}
      ```
      With Tailwind approach (if possible with fixed ratios):
      ```
      className="grid"
      style={{ gridTemplateColumns: "repeat(4, [auto-fit] minmax(0, 1fr))" }}
      ```
      Or document zone ratios in a constant and reuse across components.
    cross_phase: false

  # MEDIUM: Opacity values hardcoded in inline styles
  - severity: MEDIUM
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/cost/cumulative-cost-curve.tsx
    line: 62
    issue: |
      Bar chart uses `opacity: 0.7` and other values via inline style instead of
      Tailwind opacity scale (opacity-50, opacity-75, etc.).
      Repeated in convergence-chart.tsx, cost-breakdown.tsx, context-usage-bar.tsx.
      Inconsistent opacity values: 0.7, 0.8, various percentages.
    suggestion: |
      1. Standardize opacity values: `opacity-70` (0.7) or `opacity-80` (0.8)
      2. Or use Tailwind classes: `opacity-70` instead of `style={{ opacity: 0.7 }}`
      3. Create opacity utility values in tailwind.config if custom values needed
      4. Document opacity scale for visual hierarchy (hover, inactive, etc.)
    cross_phase: false

  # LOW: Missing max-height scale consistency
  - severity: LOW
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/memory/memory-entries.tsx
    line: 113
    issue: |
      Memory entries section uses `max-h-[28rem]` arbitrary value (448px).
      Similar pattern in globals.css shows `max-h-[32rem]` also compiled.
      Non-standard heights reduce consistency with Tailwind scale.
    suggestion: |
      Replace `max-h-[28rem]` with nearest Tailwind scale value:
      - 28rem = 448px → use `max-h-96` (24rem / 384px) or add custom theme
      - 32rem = 512px → use `max-h-screen` or define custom scale
      If exact pixel values required, document in tailwind.config theme.
    cross_phase: false

  # LOW: Responsive grid columns could use auto-fit
  - severity: LOW
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components/shared/loading-skeleton.tsx
    line: 46
    issue: |
      Card skeleton grid uses fixed breakpoints: `gap-4 sm:grid-cols-2 lg:grid-cols-3`
      Instead of responsive auto-fitting, forces 3-column at lg+ even on 2xl screens.
      Not critical but reduces layout flexibility for very wide displays.
    suggestion: |
      Consider responsive auto-fit for skeleton:
      ```
      className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      ```
      Or use CSS Grid with auto-fit if Tailwind supports it in config:
      ```
      style={{ gridTemplateColumns: "repeat(auto-fit, minmax(250px, 1fr))" }}
      ```
    cross_phase: false

  # LOW: Inconsistent border radius usage
  - severity: LOW
    file: /Users/alecsibilia/Github/luca-framework/packages/luca-observer/components
    line: 0
    issue: |
      Border radius uses mix of Tailwind classes:
      - `rounded` (0.25rem)
      - `rounded-sm` (0.25rem) — redundant?
      - `rounded-md` (0.375rem) — most common
      - `rounded-lg` (0.5rem) — most common for cards
      - `rounded-full` — only for circular elements
      No `rounded-xl` or higher values used.
      Suggests scale could be optimized or theme might have unnecessary sizes.
    suggestion: |
      1. Standardize on 2-3 radius sizes: small (sm), medium (md), large (lg)
      2. Review if `rounded` and `rounded-sm` are both needed
      3. Document radius scale in design tokens:
         - `rounded-sm` for small buttons/badges
         - `rounded-md` for form inputs, tabs
         - `rounded-lg` for cards, panels
      4. Eliminate redundant sizes from theme if not widely used
    cross_phase: false

summary:
  total_issues: 12
  critical: 1
  high: 3
  medium: 5
  low: 3

  key_findings: |
    1. CRITICAL: Arbitrary grid layout value (320px sidebar) should use theme scale
    2. Dark mode styling completely missing despite theme toggle and CSS var support
    3. Dynamic color-mix patterns duplicated across 12+ components (refactor opportunity)
    4. Hardcoded responsive breakpoints don't account for 2xl+ displays
    5. Inline styles bypass Tailwind consistency for opacity, sizes, and colors

  cross_phase_work: |
    Issues marked cross_phase=true should be addressed in v2.8.0+ planning phase
    to prevent cascading design system inconsistencies. Dark mode support is most
    urgent as it affects entire component library.

  recommendations_priority: |
    Phase 1 (Critical):
      - Add dark mode support with dark: variants
      - Refactor hardcoded grid layout in detail-layout.tsx

    Phase 2 (High):
      - Fix responsive grid gaps (overview-cards, detail-layout)
      - Create color-mix utility to reduce inline style duplication
      - Add 2xl breakpoints for large displays

    Phase 3 (Medium):
      - Standardize opacity values using Tailwind scale
      - Document responsive typography strategy
      - Review and consolidate border-radius scale
