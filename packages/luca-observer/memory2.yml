                - generic [ref=e300]: "Traced complete MuninnDB memory write path across Luca framework. Found critical gap: 86% memory orphans because links are documented but NOT IMPLEMENTED. WRITE OPERATIONS IDENTIFIED: 1. EMITTER DOMAIN (packages/luca-framework/src/emitter/): - emit-functions.ts: 10 convenience emit functions (emitSessionStart, emitPhaseStart, emitDecision, emitError, emitAgentSpawn, emitFinding, etc.) - muninn-http.ts: HTTP client POSTs to /api/engrams (writes raw emission engrams) - Circuit breaker + batch queue for reliability - These emit ~lifecycle events only, NO semantic memories (patterns/decisions/pitfalls) 2. LU-LEARNER AGENT (src/agents/general/lu-learner.agent.ts): - Documented to extract patterns/decisions/pitfalls from session context - Step 5 \"write_memory\" calls mcp__muninn__muninn_remember() for each new entry - Documented but NOT YET IMPLEMENTED - agent definition only, no actual extraction logic 3. LU-COGNITION AGENT (src/agents/general/lu-cognition.agent.ts): - Documented to call muninn_recall_tree for brain tree - Documented to call muninn_recall for semantic recall - Has detailed tier-gating and agent-aware scoring logic - Documented but unclear if actually called - appears to be prospective design 4. WORKFLOW-SAVE SKILL (src/skills/general/workflow-save.skill.ts): - Documented to use muninn_remember_batch() for atomic memories - Step 5 explicitly documents muninn_link() for creating relationships - Examples show linking patterns: is_part_of, verified_by, produced, triggered, followed_by, learned_from - Documented but NO EVIDENCE of actual implementation in skill code 5. MEMORY-CONTEXT-BUILDER (src/shared/__helpers/memory-context-builder.ts): - buildMemoryContextBlock(): formats cached recall results for sub-agent injection - requestMemoryContext(): reads from recall-cache (deferred recall pattern) - Does NOT call MuninnDB - only formats cached results - IMPLEMENTED and working 6. RECALL-CACHE (src/shared/__helpers/recall-cache.ts): - Session-scoped cache for deferred recall results - getCachedRecall(), setCachedRecall(), hasRecallCache() - IMPLEMENTED and working ROOT CAUSE OF ORPHANS: No actual LINKING implementation found. Search for \"muninn_link\" in agent/skill code: - Found only in SKILL.md documentation (workflow-save.skill.ts) - NOT found in any actual agent implementations - NOT found in any actual skill implementations The workflow-save skill documents that links should be created: \"Phase executions to their verification results\" \"Commits to the phase that produced them\" \"Learnings to the phase they came from\" \"Stall events to the convergence data that triggered them\" \"Session start to session end\" But no code calls mcp__muninn__muninn_link(). MEMORY WRITE PATTERNS: 1. Emission layer (emitter domain): Only lifecycle events, no semantic memories 2. Learning capture (lu-learner): Documented but not implemented 3. Workflow persistence (workflow-save): Documented to create links, but links not created 4. Memory formatting (memory-context-builder): Only formats, doesn't write Tags: [architecture, muninn, memory-system, missing-implementation] Entities: [MuninnDB, lu-learner, workflow-save, emitter-domain, memory-linking]"
