                - generic [ref=e408]: "lu-cognition agent files are prompt templates (Markdown with YAML frontmatter), NOT executable TypeScript. Changes to lu-cognition behavior are prompt text modifications, not code changes. This means: (1) no TypeScript compilation to verify, (2) no import statements, (3) changes are validated by reading the prompt output, not by running code. The requestMemoryContext() function referenced in lu-cognition is injected by the calling skill at runtime -- lu-cognition itself does not execute it. This distinction matters when planning execution waves: lu-cognition changes are Wave 1 (schema/foundation) because they define the contract, even though they are not compiled. Tags: [decisions, architecture]. Agent: lu-executor. Relevant to: [lu-executor, lu-planner, lu-cognition]."
