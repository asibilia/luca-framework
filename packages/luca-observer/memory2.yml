                - generic [ref=e525]: "UI components can have hidden dependencies on custom hooks that are not visible from direct import analysis of the files being deleted. During Phase 02 of v3.2.0, status-indicator.tsx had a dependency on the useWorkflowState hook (which was being deleted as part of SpacetimeDB removal). This was not caught by the initial deletion plan because the dependency was through a hook barrel import, not a direct SpacetimeDB import. The research phase caught it by searching for all consumers of the hooks being deleted. Prevention: when planning to delete hooks/utilities, search for ALL consumers of those hooks across the codebase, not just files that directly import the framework being removed."
