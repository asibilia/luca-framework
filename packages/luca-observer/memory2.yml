                  - generic [ref=e397]: 30%
                - generic [ref=e399]: "After bulk file deletions (e.g., removing pages that consumed shared components), orphaned stores and shared components can remain in the codebase. These are files that were only used by the deleted files but are not directly imported by them -- they were consumed indirectly via hooks or intermediate layers. During Phase 02 of v3.2.0, code review discovered orphaned stores (session.ts, filters.ts) and several shared components that no longer had consumers after SpacetimeDB page deletions. Prevention: after any bulk deletion, run a dead-code/unused-export analysis to catch orphans, or have code review specifically look for files whose only consumers were in the deleted set."
