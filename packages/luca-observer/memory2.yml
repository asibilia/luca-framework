                    - generic [ref=e324]: procedure:large-scale-dependency-removal
                  - generic [ref=e325]: 65%
                - generic [ref=e327]: "Procedure for removing a framework/dependency from a large codebase. Trigger: Need to strip an entire framework (e.g., SpacetimeDB, Redux, Firebase) from a project with many consuming files. Steps: 1. Research phase: grep codebase for ALL imports/references to the framework. Build a complete dependency graph. Cross-reference against planning docs (CONTEXT.md) and correct any misidentifications. 2. Identify indirect consumers: search for all consumers of hooks/utilities that wrap the framework, not just direct framework imports. 3. Plan bottom-up deletion order: module_bindings/generated code -> hooks/utilities -> components -> pages -> configuration files. 4. Execute deletions in order, running tsc after each layer to verify no compilation breaks. 5. Post-deletion orphan scan: search for stores, shared components, and utilities whose only consumers were in the deleted set. Flag for cleanup. 6. Code review: specifically check for orphaned artifacts, stale CSS builds, and framework references in non-TS files (configs, READMEs). 7. Verification: run full typecheck, confirm zero framework references remain via grep. Tags: [coding, patterns, architecture] Stats: execution_count=1, success_count=1, success_rate=1.0 Last executed: 2026-03-09 (Phase 02, v3.2.0 Strip SpacetimeDB from Observer)"
