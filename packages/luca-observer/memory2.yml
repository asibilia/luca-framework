                  - generic [ref=e307]: 84%
                - generic [ref=e309]: "Deferred/lazy recall pattern for MuninnDB memory in skills: instead of eagerly recalling all memory at session start (expensive, often unused), use a session-scoped recall cache with a requestMemoryContext() wrapper. The calling skill orchestrates MCP recall calls only when needed, and the cache prevents duplicate recalls within the same session. Brain tree recall and procedure recall remain eager (always needed), but pattern/decision/pitfall recall is deferred until the executor or planner actually requests it. Implemented in Phase 3 of v3.2.0. Both phase-execute and phase-plan skills updated to use cache-first deferred pattern. Tags: [patterns, architecture, performance]. Confidence: Low (first validation). Agent: lu-executor. Relevant to: [lu-cognition, lu-executor, lu-planner]."
