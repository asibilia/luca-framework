                    - generic [ref=e351]: pattern:bottom-up-deletion-order
                  - generic [ref=e352]: 45%
                - generic [ref=e354]: "When performing large-scale dependency removal (e.g., stripping a framework from a codebase), delete in bottom-up dependency order: start with the lowest-level modules (bindings, generated code), then hooks/utilities that depend on them, then components that consume those hooks, then pages that use those components, and finally configuration. This prevents intermediate compilation failures because at each step, only leaf nodes with no remaining dependents are removed. Validated during Phase 02 of v3.2.0 (Strip SpacetimeDB from Observer): 90 files deleted, 15 modified, zero intermediate compilation failures. Order used: module_bindings -> hooks -> components -> pages -> config."
