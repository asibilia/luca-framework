* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ed); color: var(--fg); font-family: var(--font); font-size: var(--fs); line-height: 1.4; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.mockbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 5px 12px; font-size: 11px; color: var(--dim); border-bottom: 1px dashed var(--line); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }

.frame { margin: 0 auto; background: var(--bg); min-height: calc(100vh - 30px); container-type: inline-size; container-name: app; }
.frame.narrow { max-width: 420px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.app { display: block; }
@container app (min-width: 640px) {

  .aside { position: sticky; top: 0; max-height: 100vh; overflow: auto; border-right: 1px solid var(--line); }

}

/* header */
.aside { padding: 12px 14px 14px; }
.kicker { color: var(--dim); font-size: 11px; }
h1 { font-size: 14px; font-weight: 600; margin: 2px 0 6px; line-height: 1.35; }
.what { color: var(--fg); margin: 0; }
.what.clamp { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.more { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-size: 12px; }
.ba { margin: 6px 0 0; font-size: 12px; }
.ba dt { color: var(--dim); margin-top: 6px; }
.ba dd { margin: 0; }
.counts { margin: 8px 0 0; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.counts b { color: var(--fg); font-weight: 600; }
.counts .a { color: var(--added); }
.counts .d { color: var(--deleted); }

.strip { display: flex; gap: 2px; margin: 12px 0 5px; height: 10px; }

.strip button.current { background: var(--focus); box-shadow: 0 0 0 1px var(--bg), 0 0 0 2px var(--focus); }
.strip button.lit { background: color-mix(in srgb, var(--orange) 70%, transparent); }
.strip button.loose { flex: 3; }
.slegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.slegend i { display: inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 4px; vertical-align: -0.5px; }

.pin { margin-top: 14px; border-left: 2px solid var(--purple); padding: 6px 10px 8px; background: color-mix(in srgb, var(--purple) 7%, transparent); }
.pin h2, .riskbox h2 { font-size: 12px; font-weight: 600; margin: 0 0 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pin p { margin: 0; font-size: 12px; }
.pin .src { color: var(--dim); font-size: 11px; margin-top: 5px; }
.riskbox { margin-top: 8px; border-left: 2px solid var(--red); padding: 6px 10px 8px; background: color-mix(in srgb, var(--red) 7%, transparent); font-size: 12px; }
.riskbox p { margin: 0; }
.jump { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-size: 12px; text-align: left; }
.jump:hover { text-decoration: underline; }
.jump.off { color: var(--dim); cursor: default; text-decoration: none; }

.nsd { display: inline-block; font-size: 10px; line-height: 14px; padding: 0 5px; border-radius: 7px; border: 1px dashed var(--warn); color: var(--warn); font-weight: 400; white-space: nowrap; cursor: help; vertical-align: 1px; }
.der { display: inline-block; font-size: 10px; line-height: 14px; padding: 0 4px; color: var(--dim); border-bottom: 1px dotted var(--dim); cursor: help; white-space: nowrap; font-weight: 400; }

.legend { margin-top: 14px; font-size: 11px; color: var(--dim); display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
.legend span { display: flex; gap: 5px; align-items: center; }

.nostory { margin-top: 12px; padding: 10px; border: 1px dashed var(--line); font-size: 12px; }
.nostory p { margin: 0 0 8px; }
.pbtn { background: var(--btn); color: var(--btnfg); border: 0; padding: 4px 11px; border-radius: 2px; cursor: pointer; font-size: 12px; }
.sbtn { background: var(--btn2); color: var(--btn2fg); border: 0; padding: 4px 11px; border-radius: 2px; cursor: pointer; font-size: 12px; }
.sbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--green) 25%, var(--btn2)); }
.note { font-size: 11px; color: var(--dim); margin-top: 6px; min-height: 1em; }

/* ledger */
.ledger { position: relative; min-width: 0; }
.tools { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); padding: 7px 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { background: none; border: 1px solid var(--line); border-radius: 11px; padding: 1px 9px; cursor: pointer; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--focus); color: var(--fg); background: color-mix(in srgb, var(--focus) 15%, transparent); }
.chips .sp { flex: 1; }
.tog { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--dim); cursor: pointer; }
.cap { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 11px; color: var(--dim); }
.ruler { display: grid; grid-template-columns: 16px 26px minmax(0, 1fr) auto var(--barw) 46px; height: 18px; margin: 4px -10px 0; padding: 0 10px; font-size: 10px; color: var(--dim); }
.ruler .rl { grid-column: 3 / 5; align-self: end; padding-bottom: 2px; }
.ruler .scale { grid-column: 5; position: relative; }
.ruler .scale span { position: absolute; bottom: 2px; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.ruler .scale span::after { content: ""; position: absolute; left: 50%; top: 13px; width: 1px; height: 4px; background: var(--dim); }
.ruler .un { grid-column: 6; align-self: end; padding-bottom: 2px; text-align: right; }

.list { padding-bottom: 46px; }
.it { display: grid; grid-template-columns: 16px 26px minmax(0, 1fr) auto var(--barw) 46px; align-items: center; min-height: var(--rowh); padding: 0 10px; cursor: pointer; position: relative; outline: none; }
.it:hover { background: var(--hover); }
.it.focus { background: var(--sel); }
.it:focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
.it > .bar { align-self: stretch; display: flex; align-items: center;
  background-image: linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick)), linear-gradient(var(--tick), var(--tick));
  background-size: 1px 100%; background-repeat: no-repeat; background-position: var(--t1) 0, var(--t2) 0, var(--t3) 0; }
.bar i { display: block; height: 7px; border-radius: 0 2px 2px 0; background: color-mix(in srgb, var(--added) 75%, transparent); position: relative; }
.bar i b { position: absolute; right: 0; top: 0; bottom: 0; background: var(--deleted); border-radius: 0 2px 2px 0; }
.it.noisy .bar i { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--fg) 30%, transparent) 0 3px, transparent 3px 5px); }
.it.focus .bar i, .it.cur .bar i { background: var(--focus); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); }
.it.big .num { color: var(--fg); }
.sn { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--dim); text-align: right; padding-right: 6px; }
.nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
.nm b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 100%; }
.nm .dir { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nm .le { font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; flex-shrink: 0; }
.nm .st { font-size: 10px; width: 9px; flex-shrink: 0; }
.st.A { color: var(--added); } .st.M { color: var(--modified); }
.nm .chg { font-size: 10px; color: var(--orange); flex-shrink: 0; }
.mk { display: flex; gap: 5px; align-items: center; padding: 0 6px; font-size: 11px; font-variant-numeric: tabular-nums; }
.mk span { display: inline-flex; align-items: center; gap: 1px; }
.mk svg, .legend svg, .gl svg, .aside svg { width: 12px; height: 12px; flex-shrink: 0; }
.ic-risk { color: var(--red); } .ic-conv { color: var(--warn); } .ic-unt { color: var(--orange); }
.ic-blast { color: var(--purple); } .ic-draft { color: var(--blue); } .ic-thread { color: var(--link); }
.gl { display: flex; align-items: center; }
.g-good { color: var(--green); } .g-walked { color: var(--blue); } .g-current { color: var(--focus); } .g-none { color: var(--dim); }

.it.grp { margin-top: 6px; font-weight: 600; border-top: 1px solid var(--line); }
.it.grp .nm { gap: 6px; align-items: center; }
.it.grp .gn, .it.grp .mini { flex-shrink: 0; }
.it.grp .nsd { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.it.grp .mini { font-weight: 400; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.it.grp .num { color: var(--fg); font-weight: 400; }
.chev { display: inline-block; width: 10px; color: var(--dim); transition: transform .12s; }
.open > .gl .chev, .it.open .chev { transform: rotate(90deg); }
.it.fold { color: var(--dim); font-size: 12px; }
.it.fold .nm { font-style: normal; }
.it.run { color: var(--dim); font-size: 12px; }
.it.run .nm { white-space: normal; }
.it.run { padding-top: 3px; padding-bottom: 3px; }
.mode-none .nm .dir { display: none !important; }
.it.lit .nm b { color: var(--fg); font-weight: 600; }
.it.lit { box-shadow: inset 2px 0 0 var(--orange); }
.it.dimmed .nm b { color: var(--dim); }
.it.noisy .nm b { color: var(--dim); }
.ntag { font-size: 10px; color: var(--dim); flex-shrink: 0; }

.detail { margin: 0 10px 8px 42px; padding: 8px 10px 10px; border-left: 1px solid var(--focus); background: var(--ed); font-size: 12px; }

.ch { padding: 6px 0; border-top: 1px solid var(--line); }
.ch .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

.ch .ln { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.ch dl { margin: 4px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 2px 8px; }
.ch dt { color: var(--dim); }
.ch dd { margin: 0; }
.ch code, .detail code { font-family: var(--mono); font-size: 11px; }
.tag { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin: 0 3px 2px 0; }
.flagm { color: var(--fg); }

.links { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.links h4, .notes h4 { margin: 0 0 3px; font-size: 11px; font-weight: 600; color: var(--dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.links ul, .notes ul { list-style: none; margin: 0 0 6px; padding: 0; }

.links .nt { color: var(--dim); }
.notes { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }

.peek { position: sticky; bottom: 0; z-index: 3; background: var(--bg); border-top: 1px solid var(--line); padding: 5px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.peek b { color: var(--fg); font-weight: 600; }
.empty { padding: 16px 12px; color: var(--dim); }
.foot { padding: 10px 12px 18px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }
@container app (max-width: 639px) {
  .nm .dir { display: none; }

window.STORY = {"repo":"asibilia/range-finder--classic","pr_number":68,"title":"Spec: armory planner, slice A (a viewer with pre-made numbers) (#56)","head_sha":"eb81be7","written_by":"Claude Opus 5.5 (luca-pr-prep, update after review fixes)","summary":{"kind":"enhancement","what_changed":"Adds a new private package, @goturbo/armory: a React page bundled by Bun that opens a results file the gear sim made offline. It shows the character's gear on the left around a placeholder model, each slot's best upgrade, an item picker with a wishlist, and on the right a card with the fight readings, charts, the role sliders that pick between ready-made plans, damage split, stat weights and checks, plus talents and Pawn-string dialogs. The results file contract is a strict Zod 4 schema with eighteen cross-field rules and a generated JSON Schema, and the package ships two hand-made Truncha samples and a README. An error boundary, a function component over the react-error-boundary package, keeps a bad file from blanking the page. The repo's scripts, catalog, commit scopes, AGENTS.md, CONTEXT.md and changeset docs include the package, and its tests join check:all. Thirteen review-fix commits since the first story changed the layout, the out_of_mana_s contract, talent bounds, duplicate rules, gain rounding, read errors and page-wide drops, and the tests, then swapped the hand-written error boundary class for react-error-boundary and dropped the flex CSS the two-column grid replaced.","before":"The repo held only the Turbo addon and the Turbo site. Sim results existed only as a Markdown report outside the repo, and CI's only test step was the addon's Lua tests.","after":"`bun run dev:armory` serves a page that reads a results file in the browser (picked, dropped anywhere on the page, or the bundled sample) and lays the character out like an armory, gear left and card right. A wrong, unreadable or mismatched file shows a clear message, and a render error shows Start over instead of a /* ---------- themes (mockup only) ---------- */
const THEMES = {

  light: { 'sideBar-background': '#f8f8f8', 'editor-background': '#ffffff', foreground: '#3b3b3b', descriptionForeground: '#717171', focusBorder: '#005fb8', 'list-hoverBackground': '#f0f0f0', 'list-activeSelectionBackground': '#e4e6f1', 'panel-border': '#e5e5e5', 'badge-background': '#cccccc', 'charts-red': '#e51400', 'charts-yellow': '#bf8803', 'charts-green': '#388a34', 'charts-blue': '#1a85ff', 'charts-purple': '#652d90', 'charts-orange': '#d18616', 'gitDecoration-addedResourceForeground': '#587c0c', 'gitDecoration-deletedResourceForeground': '#ad0707', 'gitDecoration-modifiedResourceForeground': '#895503', 'editorWarning-foreground': '#bf8803', errorForeground: '#e51400', 'textLink-foreground': '#005fb8', 'button-background': '#005fb8', 'button-foreground': '#ffffff', 'button-secondaryBackground': '#e5e5e5', 'button-secondaryForeground': '#3b3b3b' }

const MAXL = 4000;
const pos = n => Math.log10(n + 1) / Math.log10(MAXL + 1) * 100;

/* ---------- derived model ---------- */
const files = S.files;
const fileBy = new Map(files.map(f => [f.path, f]));
const stopBy = new Map();

const changesBy = new Map();
const changeById = new Map();
for (const s of S.stops) for (const c of s.changes) {
  c.stop = s; changeById.set(c.id, c);
  if (!changesBy.has(c.path)) changesBy.set(c.path, []);
  changesBy.get(c.path).push(c);
}
const looseOrder = new Map();
loose.changes.forEach((c, i) => { if (!looseOrder.has(c.path)) looseOrder.set(c.path, i); });
for (const f of files) {
  const st = stopBy.get(f.path);
  f.stop = st || null;
  f.order = st ? st.idx : 100 + (looseOrder.has(f.path) ? looseOrder.get(f.path) : 99);
  f.size = f.add + f.del;
  const cs = changesBy.get(f.path) || [];
  f.changes = cs;
  const fl = cs.flatMap(c => c.flags);
  f.risk = fl.filter(x => x.kind === 'risk').length;
  f.conv = fl.filter(x => x.kind !== 'risk').length;
  f.untested = cs.some(c => !c.covered);
  f.blast = cs.reduce((m, c) => Math.max(m, c.blast || 0), 0);
  f.blastOut = cs.reduce((m, c) => Math.max(m, c.blast_out || 0), 0);
  f.drafts = D.drafts.filter(d => d.path === f.path);
  f.threads = D.threads.filter(t => t.path === f.path && !t.resolved);
  f.peek = (cs.find(c => c.flags.length) || cs[0] || {}).check || f.role;
  const firstFlag = fl[0];
  f.peekFlag = firstFlag ? firstFlag.message : '';
}
const needsLook = f => f.risk || f.conv || f.untested || f.blastOut > 0 || f.drafts.length || f.threads.length;
const groupFiles = g => files.filter(f => f.group === g.id).sort((a, b) => a.order - b.order);
const changed = new Set(D.second_visit.changed);

/* ---------- state ---------- */
const st = {
  mode: 'first', filter: 'all', showNoise: false, theme: 'dark', width: 'narrow',
  collapsed: new Set(), openRows: new Set(), openNoise: new Set(), openRuns: new Set(),
  focusKey: null, hoverKey: null, summaryOpen: false, good: new Set(), done: new Set(), current: null, note: ''
};
function resetMode() {
  st.openRows.clear(); st.openNoise.clear(); st.openRuns.clear(); st.collapsed.clear(); st.note = '';
  st.filter = 'all';
  if (st.mode === 'first') {
    st.good = new Set(D.looks_good); st.done = new Set(D.done_stop_ids); st.current = D.current_stop_id;
  } else if (st.mode === 'second') {
    st.good = new Set(files.filter(f => !changed.has(f.path)).map(f => f.path));
    st.done = new Set(S.stops.map(s => s.id)); st.current = null;
  } else {
    st.good = new Set(); st.done = new Set(); st.current = null;
  }
  st.focusKey = null;
}

function fileState(f) {
  if (st.good.has(f.path)) return 'good';
  if (st.mode !== 'first') return 'none';
  if (f.stop && f.stop.id === st.current) return 'current';
  if (f.stop && st.done.has(f.stop.id)) return 'walked';
  return 'none';
}
function stopState(s) {
  const fs = s.path ? [fileBy.get(s.path)] : [...new Set(s.changes.map(c => c.path))].map(p => fileBy.get(p)).filter(Boolean);
  if (fs.length && fs.every(f => st.good.has(f.path))) return 'good';
  if (s.id === st.current) return 'current';
  if (st.mode === 'second' && fs.some(f => changed.has(f.path))) return 'lit';
  if (st.done.has(s.id)) return 'walked';
  return 'left';
}

  good: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/><path d="M3.6 6.1l1.6 1.6 3.2-3.4" fill="none" stroke="var(--bg)" stroke-width="1.4"/></svg>',
  walked: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6" cy="6" r="4.5"/><circle cx="6" cy="6" r="2" fill="currentColor" stroke="none"/></svg>',
  current: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4.7 3.5 8.5 6 4.7 8.5z" fill="currentColor"/></svg>',
  none: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".7"><circle cx="6" cy="6" r="4.5"/></svg>'
};
const STATE_WORD = { good: 'Looks good', walked: 'Walked', current: 'You are here', none: 'Not looked at' };
const NSD = (field) => `<span class="nsd" title="Needs story data: ${esc(field)}">needs story data</span>`;
const DER = (why) => `<span class="der" title="${esc(why)}">derived</span>`;

function barHtml(add, del) {
  const n = add + del;
  const w = pos(n);
  const dw = n ? del / n * 100 : 0;
  return `<span class="bar"><i style="width:${w.toFixed(2)}%">${dw ? `<b style="width:${Math.max(dw, 4).toFixed(1)}%"></b>` : ''}</i></span>`;
}
function markers(f) {
  const m = [];
  if (f.risk) m.push(`<span class="ic-risk" title="Risk flag">${I.risk}</span>`);
  if (f.conv) m.push(`<span class="ic-conv" title="Cleanliness or convention flag">${I.conv}</span>`);
  if (f.untested) m.push(`<span class="ic-unt" title="Has an untested change">${I.unt}</span>`);
  if (f.blast >= 3 || f.blastOut) m.push(`<span class="ic-blast" title="${f.blast} dependents in this PR${f.blastOut ? ', ' + f.blastOut + ' outside it' : ''}">${I.blast}${f.blast}${f.blastOut ? '+' : ''}</span>`);
  if (f.drafts.length) m.push(`<span class="ic-draft" title="${f.drafts.length} draft comment${f.drafts.length > 1 ? 's' : ''}">${I.draft}${f.drafts.length}</span>`);

function split(p) { const i = p.lastIndexOf('/'); return i < 0 ? ['', p] : [p.slice(0, i), p.slice(i + 1)]; }

  } else {
    const curStop = S.stops.find(s => s.id === st.current);
    legend = `<span><i style="background:color-mix(in srgb,var(--blue) 45%,transparent)"></i>${counts.walked} walked</span><span><i style="background:var(--green)"></i>${counts.good} look good</span>${curStop ? `<span><i style="background:var(--focus)"></i>stop ${curStop.n} now</span>` : ''}<span><i style="background:color-mix(in srgb,var(--fg) 14%,transparent)"></i>${counts.left} left</span>`;
  }
  const fw = sm.feedback_wanted;
  const rf = sm.flags[0];
  a.innerHTML = head + `
    <p class="what ${st.summaryOpen ? '' : 'clamp'}">${md(sm.what_changed)}</p>
    <button class="more" id="moreBtn" aria-expanded="${st.summaryOpen}">${st.summaryOpen ? 'Show less' : 'Before and after'}</button>
    ${st.summaryOpen ? `<dl class="ba"><dt>Before</dt><dd>${md(sm.before)}</dd><dt>After</dt><dd>${md(sm.after)}</dd></dl>` : ''}
    <div class="counts"><b>${nFiles}</b> files, <span class="a">+${fmt(sm.counts.lines_added)}</span> <span class="d">&minus;${fmt(sm.counts.lines_removed)}</span>, <b>${S.stops.length}</b> stops, about <b>${sm.review_minutes}</b> minutes</div>
    ${st.mode === 'second' ? `<div class="counts">Since your last review at <code>${esc(D.second_visit.since)}</code>, ${changed.size} files changed.</div>` : ''}
    <div class="strip" aria-label="Progress by stop">${segs}</div>
    <div class="slegend">${legend}</div>
    <div class="slegend" style="margin-top:4px"><span class="ic-draft" style="display:inline-flex;gap:3px;align-items:center">${I.draft}${drafts} drafts</span><span class="ic-thread" style="display:inline-flex;gap:3px;align-items:center">${I.thread}${open} open thread</span></div>
    <div class="pin" role="note">
      <h2>The writer was least sure about ${NSD('a stop or change id on summary.feedback_wanted, so it can be pinned to rows')}</h2>
      <p>${md(fw.text)}</p>
      <div class="src">${fw.source === 'guessed' ? 'Guessed by the story writer, not asked by the author.' : 'Asked by the author.'} Not pinned to rows yet.</div>
    </div>
    ${rf ? `<div class="riskbox" role="note"><h2><span class="ic-risk" style="display:inline-flex">${I.risk}</span>${esc(rf.rule)}</h2><p>${esc(rf.message)}</p>
      <button class="jump" data-jump="${esc(rf.path)}">${esc(split(rf.path)[1])}, line ${rf.line}</button></div>` : ''}
    <details class="legend"><summary>What the marks mean</summary>
      <span class="g-good">${I.good}<span style="color:var(--dim)">looks good</span></span><span class="g-walked">${I.walked}<span style="color:var(--dim)">walked</span></span>
      <span class="g-current">${I.current}<span style="color:var(--dim)">you are here</span></span><span class="g-none">${I.none}<span>not looked at</span></span>
      <span class="ic-risk">${I.risk}<span style="color:var(--dim)">risk flag</span></span><span class="ic-conv">${I.conv}<span style="color:var(--dim)">cleanliness flag</span></span>
      <span class="ic-unt">${I.unt}<span style="color:var(--dim)">untested</span></span><span class="ic-blast">${I.blast}<span style="color:var(--dim)">3 or more dependents, + if outside the PR</span></span>
      <span class="ic-draft">${I.draft}<span style="color:var(--dim)">your drafts</span></span><span class="ic-thread">${I.thread}<span style="color:var(--dim)">open threads</span></span>
    </details>`;
  $('#moreBtn').onclick = () => { st.summaryOpen = !st.summaryOpen; renderAside(); };
  bindJumps(a);
}
function bindJumps(root) {
  root.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); jumpTo(b.dataset.jump); }));
}

/* ---------- tools ---------- */
function renderTools() {
  const t = $('#tools');
  const pool = st.mode === 'none' ? S.no_story_files.map(f => fileBy.get(f.path) || f) : files;
  const nAll = pool.length;
  const nLook = files.filter(needsLook).length;
  const nNot = pool.filter(passesNot).length;
  const chips = st.mode === 'none'
    ? [['all', 'All', nAll], ['not', 'Not looked at', nNot]]
    : [['all', 'All', nAll], ['look', 'Needs a look', nLook], ['not', st.mode === 'second' ? 'Left to look at' : 'Not walked', nNot]];
  t.innerHTML = `<div class="chips" role="group" aria-label="Filter">${chips.map(([k, l, n]) => `<button class="chip" data-f="${k}" aria-pressed="${st.filter === k}">${l} ${n}</button>`).join('')}
    <span class="sp"></span>${st.mode === 'none' ? '' : `<label class="tog"><input type="checkbox" id="noiseTog" ${st.showNoise ? 'checked' : ''}> Show noise</label>`}</div>
    ${st.mode === 'none' ? `<div class="cap">By folder, from the diff</div>` : `<div class="cap">Grouped by a guess from folder names ${NSD('map.groups on the story')}</div>`}
    <div class="ruler" aria-hidden="true"><span class="rl">${st.mode === 'none' ? 'File' : 'Stop and file'}</span><span class="scale"><span style="left:${pos(10)}%">10</span><span style="left:${pos(100)}%">100</span><span style="left:${pos(1000)}%">1k</span></span><span class="un">lines</span></div>`;
  t.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.filter = b.dataset.f; render(); });
  const nt = $('#noiseTog');
  if (nt) nt.onchange = () => { st.showNoise = nt.checked; render(); };
}

/* ---------- list ---------- */
function passesNot(f) { const o = st.filter; st.filter = 'not'; const r = passes(f); st.filter = o; return r; }
function passes(f) {
  if (st.filter === 'look') return !!needsLook(f);
  if (st.filter === 'not') return st.mode === 'none' ? !st.good.has(f.path) : st.mode === 'second' ? changed.has(f.path) && !st.good.has(f.path) : fileState(f) === 'none';
  return true;
}
function fileRow(f, extra = '') {
  const s = fileState(f);
  const [dir, base] = split(f.path);
  const key = 'f:' + f.path;
  const open = st.openRows.has(key);
  const lit = st.mode === 'second' && changed.has(f.path);
  const cls = ['it', 'file', f.noise && st.mode !== 'none' ? 'noisy' : '', s === 'current' ? 'cur' : '', f.size >= 300 ? 'big' : '', lit ? 'lit' : '', open ? 'open' : '', extra].filter(Boolean).join(' ');
  const stopCell = st.mode === 'none' ? '' : (f.stop ? f.stop.n : '');
  const status = f.status === 'added' ? 'A' : f.status === 'deleted' ? 'D' : 'M';
  const tags = st.mode === 'none' ? '' :
    (!f.stop ? '<span class="le" title="Only in the loose ends stop">loose end</span>' : '') +
    (f.noise ? `<span class="ntag">${esc(f.noise)}</span>` : '') +
    (lit ? '<span class="chg">changed</span>' : '');
  return `<div class="${cls}" role="treeitem" aria-level="2" aria-expanded="${open}" tabindex="-1" data-key="${esc(key)}" aria-label="${esc(base + ', ' + fmt(f.size) + ' lines, ' + STATE_WORD[s])}">
    <span class="gl g-${s}" title="${STATE_WORD[s]}">${I[s]}</span><span class="sn">${stopCell}</span>
    <span class="nm"><span class="st ${status}" title="${f.status}">${status}</span><b>${esc(base)}</b>${tags}<span class="dir">${esc(dir)}</span></span>
    <span class="mk">${st.mode === 'none' ? '' : markers(f)}</span>${barHtml(f.add, f.del)}<span class="num" title="+${f.add} &minus;${f.del}">${fmt(f.size)}</span></div>` + (open ? detailHtml(f) : '');
}
function emptyBar() { return `<span class="bar"></span>`; }

function renderList() {
  const L = $('#list');
  let h = '';
  if (st.mode === 'none') {
    const dirs = new Map();
    for (const nf of S.no_story_files) {
      const f = fileBy.get(nf.path) || Object.assign({ size: nf.add + nf.del }, nf);
      if (!passes(f)) continue;
      const d = split(nf.path)[0] || '(repo root)';
      if (!dirs.has(d)) dirs.set(d, []);
      dirs.get(d).push(f);
    }
    for (const [d, fs] of [...dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
      const key = 'g:' + d;
      const col = st.collapsed.has(key);
      const tot = fs.reduce((s, f) => s + f.size, 0);
      const g = fs.filter(f => st.good.has(f.path)).length;
      h += `<div class="it grp ${col ? '' : 'open'}" role="treeitem" aria-level="1" aria-expanded="${!col}" tabindex="-1" data-key="${esc(key)}">
        <span class="gl"><span class="chev">&#9656;</span></span><span></span><span class="nm"><span>${esc(d)}</span><span class="mini" title="${g} of ${fs.length} files look good">${g} of ${fs.length}</span></span><span></span>${emptyBar()}<span class="num">${fmt(tot)}</span></div>`;
      if (!col) for (const f of fs.sort((a, b) => a.path.localeCompare(b.path))) h += fileRow(f);
    }
  } else {
    for (const g of S.groups) {
      const all = groupFiles(g);
      const vis = all.filter(passes);
      if (!vis.length) continue;
      const key = 'g:' + g.id;
      const col = st.collapsed.has(key);
      const tot = all.reduce((s, f) => s + f.size, 0);
      const good = all.filter(f => st.good.has(f.path)).length;
      h += `<div class="it grp ${col ? '' : 'open'}" role="treeitem" aria-level="1" aria-expanded="${!col}" tabindex="-1" data-key="${esc(key)}" title="${esc(g.blurb)}">
        <span class="gl"><span class="chev">&#9656;</span></span><span></span>
        <span class="nm"><span class="gn">${esc(g.name)}</span><span class="mini" title="${good} of ${all.length} files look good">${good} of ${all.length}</span>${NSD('map.groups: this group is guessed from folder names')}</span>
        <span></span>${emptyBar()}<span class="num" title="Lines in this group">${fmt(tot)}</span></div>`;
      if (col) continue;
      const main = vis.filter(f => !f.noise);
      const noise = vis.filter(f => f.noise);
      if (st.mode === 'second') {
        let run = [], ri = 0;
        const flush = () => {
          if (!run.length) return;
          const rk = 'u:' + g.id + ':' + ri++;
          if (st.openRuns.has(rk)) { run.forEach(f => h += fileRow(f, 'dimmed')); run = []; return; }
          const ns = run.filter(f => f.stop).length, nl = run.length - ns;
          const what = [ns ? ns + (ns === 1 ? ' stop' : ' stops') : '', nl ? nl + (nl === 1 ? ' file' : ' files') : ''].filter(Boolean).join(' and ');
          const lines = run.reduce((s, f) => s + f.size, 0);
          const allGood = run.every(f => st.good.has(f.path));
          h += `<div class="it run" role="treeitem" aria-level="2" aria-expanded="false" tabindex="-1" data-key="${rk}">
            <span class="gl g-${allGood ? 'good' : 'none'}">${I[allGood ? 'good' : 'none']}</span><span></span>
            <span class="nm"><span>Unchanged since your last review (${what}, ${allGood ? 'still looks good' : 'some not looked at'})</span></span><span></span>${emptyBar()}<span class="num">${fmt(lines)}</span></div>`;
          run = [];
        };
        for (const f of main) { if (changed.has(f.path)) { flush(); h += fileRow(f); } else run.push(f); }
        flush();
      } else {
        for (const f of main) h += fileRow(f);
      }
      if (noise.length) {
        const nk = 'n:' + g.id;
        const open = st.showNoise || st.openNoise.has(nk);
        const lines = noise.reduce((s, f) => s + f.size, 0);
        const kinds = [...new Set(noise.map(f => f.noise))].join(', ');
        h += `<div class="it fold ${open ? 'open' : ''}" role="treeitem" aria-level="2" aria-expanded="${open}" tabindex="-1" data-key="${nk}">
          <span class="gl"><span class="chev">&#9656;</span></span><span></span>
          <span class="nm"><span>Noise (${noise.length} ${noise.length === 1 ? 'file' : 'files'}, ${fmt(lines)} lines)</span><span class="ntag">${esc(kinds)}</span>${DER('Lockfile and generated are found from the path and a configures link. Sample data is a guess; a noise flag on the story would make it exact.')}</span>
          <span></span>${emptyBar()}<span class="num">${fmt(lines)}</span></div>`;
        if (open) noise.forEach(f => h += fileRow(f));
      }
    }
  }
  L.innerHTML = h || `<div class="empty">Nothing matches this filter. Choose All to see every file.</div>`;
  bindList();
}

function detailHtml(f) {
  const s = f.stop;
  const good = st.good.has(f.path);
  let h = `<div class="detail" role="group" aria-label="Changes in ${esc(split(f.path)[1])}">`;
  if (st.mode === 'none') {
    h += `<p class="why">${f.status === 'added' ? 'Added' : 'Changed'}: <span style="color:var(--added)">+${f.add}</span> <span style="color:var(--deleted)">&minus;${f.del}</span>. No story, so no notes for this file.</p>`;
  } else {
    h += s ? `<h3>Stop ${s.n}. ${esc(s.title)}</h3><p class="why">${md(s.why_here)}</p>`
           : `<h3>Loose ends</h3><p class="why">${md(f.role)}</p>`;
    if (f.noise) h += `<p class="why" style="color:var(--dim)">Folded as ${esc(f.noise)} ${DER('Guessed from the path')}</p>`;
    for (const c of f.changes) {
      const from = c.from ? changeById.get(c.from) : null;
      const next = [...changeById.values()].filter(x => x.from === c.id && x.path !== c.path);
      h += `<div class="ch"><div class="t"><strong>${esc(c.title)}</strong><span class="ln">lines ${c.start} to ${c.end}${c.symbol ? ', ' + esc(c.symbol) : ''}</span></div><dl>
        <dt>Check</dt><dd>${md(c.check)}</dd>
        <dt>Proof</dt><dd>${c.covered ? md(c.proof_note || '') + (c.tests.length ? '<br>' + c.tests.map(t => `<span class="tag">${esc(t)}</span>`).join('') : '') : `<span class="ic-unt">Untested.</span> ${md(c.proof_note || '')}`}</dd>
        ${c.serves.length ? `<dt>Serves</dt><dd>${c.serves.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</dd>` : ''}
        <dt>Reach</dt><dd>${c.blast} ${c.blast === 1 ? 'dependent' : 'dependents'} in this PR${c.blast_out ? `, <span class="ic-blast">${c.blast_out} outside it</span>` : ''}</dd>
        ${c.flags.map(fl => `<dt>Flag</dt><dd class="flagm"><span class="k ${fl.kind}">${esc(fl.kind)}</span>, line ${fl.line}: ${esc(fl.message)}</dd>`).join('')}
        ${from ? `<dt>From</dt><dd><button class="jump" data-jump="${esc(from.path)}">${esc(from.title)}</button> <span style="color:var(--dim)">in ${esc(split(from.path)[1])}</span></dd>` : ''}
        ${next.length ? `<dt>Leads to</dt><dd>${next.map(n => `<button class="jump" data-jump="${esc(n.path)}">${esc(split(n.path)[1])}</button>`).join(', ')}</dd>` : ''}
      </dl></div>`;
    }
    const notes = [...f.drafts.map(d => `<li><span class="ic-draft">Your draft</span>, line ${d.line}: ${esc(d.body)}</li>`), ...f.threads.map(t => `<li><span class="ic-thread">Open thread</span> by ${esc(t.author)}, line ${t.line}: ${esc(t.body)}</li>`)];
    if (notes.length) h += `<div class="notes"><h4>Comments</h4><ul>${notes.join('')}</ul></div>`;
    const out = S.links.filter(l => l.from === f.path), inc = S.links.filter(l => l.to === f.path);
    const li = (l, other) => `<li><span class="lk">${esc(l.kind)}</span>${fileBy.has(other) ? `<button class="jump" data-jump="${esc(other)}">${esc(split(other)[1])}</button>` : `<span class="jump off" title="Not changed in this PR">${esc(other)}</span>`} <span class="nt">${esc(l.note)}</span></li>`;
    if (out.length || inc.length) {
      h += `<div class="links"><h4>Connects to ${NSD('which way data flows, beyond the link kind and note')}</h4>`;
      if (out.length) h += `<ul aria-label="Outgoing">${out.map(l => li(l, l.to)).join('')}</ul>`;
      if (inc.length) h += `<h4>Used by</h4><ul aria-label="Incoming">${inc.map(l => li(l, l.from)).join('')}</ul>`;
      h += `</div>`;
    }
  }
  h += `<div class="acts"><button class="pbtn" data-diff="${esc(f.path)}">Open in diff</button><button class="sbtn" data-good="${esc(f.path)}" aria-pressed="${good}">${good ? 'Looks good' : 'Mark looks good'}</button><span class="note" data-diffnote></span></div></div>`;
  return h;
}

/* ---------- behaviour ---------- */
function items() { return [...document.querySelectorAll('#list [data-key]')]; }
function itemFor(k) { return items().find(e => e.dataset.key === k); }
function setFocus(el, scroll = true) {
  if (!el) return;
  items().forEach(e => { e.tabIndex = -1; e.classList.remove('focus'); });
  el.tabIndex = 0; el.classList.add('focus'); st.focusKey = el.dataset.key;
  el.focus({ preventScroll: !scroll });
  if (scroll) el.scrollIntoView({ block: 'nearest' });
  updatePeek();
}
function fileOf(key) { return key && key.startsWith('f:') ? fileBy.get(key.slice(2)) || S.no_story_files.find(f => f.path === key.slice(2)) : null; }
function updatePeek() {
  const p = $('#peek');
  const k = st.hoverKey || st.focusKey;
  const f = fileOf(k);
  if (!f) { p.innerHTML = st.mode === 'none' ? 'Arrows move, right opens, space marks looks good.' : 'Arrows move, right opens, left closes, space marks looks good.'; return; }
  if (st.mode === 'none') { p.innerHTML = `<b>${esc(split(f.path)[1])}</b>: +${f.add} &minus;${f.del}`; return; }
  p.innerHTML = f.peekFlag ? `<b>Flag:</b> ${esc(f.peekFlag)}` : `<b>Check this:</b> ${md(f.peek)}`;
  p.title = p.textContent;
}
function toggle(set, k) { set.has(k) ? set.delete(k) : set.add(k); }
function activate(el, how) {
  const k = el.dataset.key, t = k[0];
  if (t === 'g') { if (how === 'open') st.collapsed.delete(k); else if (how === 'close') st.collapsed.add(k); else toggle(st.collapsed, k); }
  else if (t === 'f') { if (how === 'open') st.openRows.add(k); else if (how === 'close') st.openRows.delete(k); else toggle(st.openRows, k); }
  else if (t === 'n') { if (st.showNoise && how !== 'open') { st.showNoise = false; st.openNoise.delete(k); } else if (how === 'open') st.openNoise.add(k); else if (how === 'close') st.openNoise.delete(k); else toggle(st.openNoise, k); }
  else if (t === 'u') { st.openRuns.add(k); render(); const first = items().find(e => e.classList.contains('dimmed')); setFocus(first); return; }
  render(); setFocus(itemFor(k));
}
function toggleGood(path) {
  toggle(st.good, path);
  const k = st.focusKey;
  render(); if (k) setFocus(itemFor(k), false);
}
function groupHeaderOf(el) {
  let e = el.previousElementSibling;
  while (e && !e.classList.contains('grp')) e = e.previousElementSibling;
  return e;
}
function bindList() {
  const L = $('#list');
  items().forEach(el => {
    el.addEventListener('click', () => { setFocus(el, false); activate(el, 'toggle'); });
    el.addEventListener('mouseenter', () => { st.hoverKey = el.dataset.key; updatePeek(); });
    el.addEventListener('mouseleave', () => { st.hoverKey = null; updatePeek(); });
  });
  L.querySelectorAll('[data-good]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleGood(b.dataset.good); });
  L.querySelectorAll('[data-diff]').forEach(b => b.onclick = e => { e.stopPropagation(); const n = b.parentElement.querySelector('[data-diffnote]'); n.textContent = 'In the app this opens ' + split(b.dataset.diff)[1] + ' in the diff editor.'; });
  bindJumps(L);
  const f = st.focusKey && itemFor(st.focusKey);
  const first = f || items()[0];
  if (first) { first.tabIndex = 0; if (f) f.classList.add('focus'); }
}
$('#list').addEventListener('keydown', e => {
  const el = e.target.closest('[data-key]');
  if (!el || e.target !== el) return;
  const all = items(), i = all.indexOf(el), k = el.dataset.key, t = k[0];
  const isOpen = el.getAttribute('aria-expanded') === 'true';
  switch (e.key) {
    case 'ArrowDown': setFocus(all[Math.min(i + 1, all.length - 1)]); break;
    case 'ArrowUp': setFocus(all[Math.max(i - 1, 0)]); break;
    case 'Home': setFocus(all[0]); break;
    case 'End': setFocus(all[all.length - 1]); break;
    case 'ArrowRight':
      if (t === 'g' && isOpen) setFocus(all[i + 1]);
      else if (!isOpen) activate(el, 'open');
      break;
    case 'ArrowLeft':
      if (t !== 'g' && isOpen) activate(el, 'close');
      else if (t === 'g') { if (isOpen) activate(el, 'close'); }
      else setFocus(groupHeaderOf(el));
      break;
    case 'Enter': activate(el, 'toggle'); break;
    case ' ':
      if (t === 'f') toggleGood(k.slice(2)); else activate(el, 'toggle');
      break;
    default: return;
  }
  e.preventDefault();
});

function jumpTo(path) {
  const f = fileBy.get(path) || S.no_story_files.find(x => x.path === path);
  if (!f) return;
  st.filter = 'all';
  if (st.mode === 'none') st.collapsed.delete('g:' + (split(path)[0] || '(repo root)'));
  else {
    st.collapsed.delete('g:' + f.group);
    if (f.noise) st.openNoise.add('n:' + f.group);
    if (st.mode === 'second' && !changed.has(path)) {
      render();
      const runs = items().filter(e => e.dataset.key.startsWith('u:' + f.group + ':'));
      runs.forEach(r => st.openRuns.add(r.dataset.key));
    }
  }
  const k = 'f:' + path;
  render();
  setFocus(itemFor(k));
}

function render() { renderAside(); renderTools(); renderList(); updatePeek(); syncSegs(); }
function syncSegs() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === st.mode));
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.theme === st.theme));
  document.querySelectorAll('#widthSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === st.width));
  $('#frame').classList.toggle('narrow', st.width === 'narrow');
  $('#frame').classList.toggle('mode-none', st.mode === 'none');
}
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; resetMode(); render(); });
document.querySelectorAll('#themeSeg button').forEach(b => b.onclick = () => { st.theme = b.dataset.theme; applyTheme(st.theme); syncSegs(); });
document.querySelectorAll('#widthSeg button').forEach(b => b.onclick = () => { st.width = b.dataset.w; syncSegs(); });

const q = new URLSearchParams(location.search);
st.width = q.get('w') || (window.innerWidth >= 900 ? 'wide' : 'narrow');
st.mode = q.get('mode') || 'first';
st.theme = q.get('theme') || 'dark';
applyTheme(st.theme);
resetMode();
render();
if (q.get('open')) jumpTo(q.get('open')), st.openRows.add('f:' + q.get('open')), render(), setFocus(itemFor('f:' + q.get('open')));
